[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcr-router"
version = "0.2.0"
description = "Role-aware context routing (RCR) with OpenSearch memory and LiteLLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opensearch-py>=2.4.0",
  "litellm>=1.40.0",
  "tiktoken>=0.7.0",
  "streamlit>=1.28.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
