# LiteLLM proxy in front of Cloudera AI Inference Service.
#
# 1) Fill env (see deploy/env.cloudera.example)
# 2) Render config:
#      python scripts/render_litellm_cloudera_config.py \
#        --out deploy/litellm_config.cloudera.generated.yaml
# 3) Start:
#      docker compose -f deploy/docker-compose.litellm.yaml up -d
#
# Point the AMP at the proxy:
#   RCR_USE_MOCK_LLM=false
#   LITELLM_API_BASE=http://localhost:4000
#   LITELLM_API_KEY=$LITELLM_MASTER_KEY
#   LITELLM_MODEL=cloudera-chat
#   LITELLM_EMBED_MODEL=cloudera-embed

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: rcr-litellm
    ports:
      - "4000:4000"
    volumes:
      - ${LITELLM_CONFIG_FILE:-./litellm_config.cloudera.generated.yaml}:/app/config.yaml:ro
    environment:
      CDP_TOKEN: ${CDP_TOKEN:-${CLOUDERA_AI_INFERENCE_API_KEY:-}}
      CLOUDERA_AI_INFERENCE_API_KEY: ${CLOUDERA_AI_INFERENCE_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-rcr-local}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
